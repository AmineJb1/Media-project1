name: Build Media Plus Af APK
# Rebuild after Kotlin ItemRow argument fix

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Use repository Android project
        run: echo "PROJECT_DIR=." >> "$GITHUB_ENV"

      - name: Fix Kotlin compatibility in selected source ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java"
          main = next(root.rglob("MainActivity.kt"))
          text = main.read_text()
          old = "VideoPlayer(p) { s.onPlayerError(it) }"
          new = "VideoPlayer(p, onError = { s.onPlayerError(it) })"
          if old in text:
              main.write_text(text.replace(old, new))
          elif new not in text:
              raise RuntimeError("Unexpected VideoPlayer call in MainActivity.kt")
          tv = next(root.rglob("TvPlayer.kt"))
          text = tv.read_text()
          old = "import androidx.compose.ui.focus.focusable"
          new = "import androidx.compose.foundation.focusable"
          if old in text:
              tv.write_text(text.replace(old, new))
          elif new not in text:
              raise RuntimeError("Unexpected focusable import in TvPlayer.kt")
          print("Kotlin source compatibility fixes applied")
          PY

      - name: Verify settings source before Kotlin compilation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path("app/src/main/java/com/mediaplus/afrique/SettingsScreen.kt")
          text = source.read_text()
          if "BuildConfig.VERSION_NAME" in text:
              gradle = Path("app/build.gradle.kts").read_text()
              match = re.search(r'versionName\s*=\s*"([^"]+)"', gradle)
              if not match:
                  raise RuntimeError("Unable to determine app versionName")
              text = text.replace("BuildConfig.VERSION_NAME", '"' + match.group(1) + '"')
              source.write_text(text)
              print("Removed unavailable BuildConfig reference")
          assert "BuildConfig" not in source.read_text(), "Unexpected BuildConfig reference in SettingsScreen.kt"
          print("SettingsScreen.kt verified; no BuildConfig reference")
          PY

      - name: Configure permanent signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mediaplus-release.p12"
          chmod 600 "$RUNNER_TEMP/mediaplus-release.p12"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/mediaplus-release.p12"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["PROJECT_DIR"]) / "app" / "build.gradle.kts"
          s = p.read_text()
          needle = "    buildTypes {"
          assert s.count(needle) == 1, "Expected a single buildTypes block"
          s = s.replace(needle, """    signingConfigs {
              create("permanentRelease") {
                  storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                  storeType = "pkcs12"
                  storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
              }
          }
          """ + needle, 1)
          old = 'signingConfig = signingConfigs.getByName("debug")'
          assert s.count(old) == 1, "Expected existing debug release signing line"
          s = s.replace(old, 'signingConfig = signingConfigs.getByName("permanentRelease")', 1)
          p.write_text(s)
          PY
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build permanently signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p "$PROJECT_DIR" assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Save signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaPlus-Afrique-v2.0.9
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
