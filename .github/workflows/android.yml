name: Build Media Plus Af APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Select and extract project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'MediaPlus-Cote-dIvoire-v*.zip' | sort -Vr | head -n 1)"
          if [ -z "$ZIP" ]; then
            ZIP="$(find . -maxdepth 1 -type f -name 'MediaPlusAfrique-Smart-IPTV-Pro-v*.zip' | sort -Vr | head -n 1)"
          fi
          if [ -z "$ZIP" ]; then
          while IFS= read -r candidate; do
            name="$(basename "$candidate")"
            case "$name" in
              MediaPlusAfrique-Premium-Blue-v1.0.*|MediaPlusAfrique-Premium-Blue-v1.1.*|MediaPlusAfrique-Premium-Blue-v1.2.*) continue ;;
            esac
            ZIP="$candidate"
            break
          done < <(find . -maxdepth 1 -type f -name 'MediaPlusAfrique-Premium-Blue-v*.zip' | sort -Vr)
          fi

          if [ -z "$ZIP" ]; then
            ZIP="MediaPlusAfrique-TEST-CORRIGE.zip"
          fi
          if [ ! -f "$ZIP" ]; then
            echo "Aucune archive Android compatible trouvée."
            exit 1
          fi
          echo "Archive choisie : $ZIP"
          mkdir -p source
          unzip -q "$ZIP" -d source
          SETTINGS="$(find source -name settings.gradle.kts -type f | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts introuvable dans $ZIP"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Kotlin compatibility in selected source ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java"
          main = next(root.rglob("MainActivity.kt"))
          text = main.read_text()
          old = "VideoPlayer(p) { s.onPlayerError(it) }"
          new = "VideoPlayer(p, onError = { s.onPlayerError(it) })"
          if old in text:
              main.write_text(text.replace(old, new))
          elif new not in text:
              raise RuntimeError("Unexpected VideoPlayer call in MainActivity.kt")
          tv = next(root.rglob("TvPlayer.kt"))
          text = tv.read_text()
          old = "import androidx.compose.ui.focus.focusable"
          new = "import androidx.compose.foundation.focusable"
          if old in text:
              tv.write_text(text.replace(old, new))
          elif new not in text:
              raise RuntimeError("Unexpected focusable import in TvPlayer.kt")
          print("Kotlin source compatibility fixes applied")
          PY

      - name: Configure permanent signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mediaplus-release.p12"
          chmod 600 "$RUNNER_TEMP/mediaplus-release.p12"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/mediaplus-release.p12"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["PROJECT_DIR"]) / "app" / "build.gradle.kts"
          s = p.read_text()
          needle = "    buildTypes {"
          assert s.count(needle) == 1, "Expected a single buildTypes block"
          s = s.replace(needle, """    signingConfigs {
              create("permanentRelease") {
                  storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                  storeType = "pkcs12"
                  storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
              }
          }
          """ + needle, 1)
          old = 'signingConfig = signingConfigs.getByName("debug")'
          assert s.count(old) == 1, "Expected existing debug release signing line"
          s = s.replace(old, 'signingConfig = signingConfigs.getByName("permanentRelease")', 1)
          p.write_text(s)
          PY
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build permanently signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p "$PROJECT_DIR" assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Save signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaPlus-Cote-dIvoire-SIGNED-APK
          path: source/**/build/outputs/apk/release/*.apk
          if-no-files-found: error
