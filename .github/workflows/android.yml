name: Build Media Plus Af APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Select and extract project
        shell: bash
        run: |
          set -euo pipefail
          ZIP=""
          while IFS= read -r candidate; do
            name="$(basename "$candidate")"
            case "$name" in
              MediaPlusAfrique-Premium-Blue-v1.0.*|MediaPlusAfrique-Premium-Blue-v1.1.*|MediaPlusAfrique-Premium-Blue-v1.2.*) continue ;;
            esac
            ZIP="$candidate"
            break
          done < <(find . -maxdepth 1 -type f -name 'MediaPlusAfrique-Premium-Blue-v*.zip' | sort -Vr)

          if [ -z "$ZIP" ]; then
            ZIP="MediaPlusAfrique-TEST-CORRIGE.zip"
          fi
          if [ ! -f "$ZIP" ]; then
            echo "Aucune archive Android compatible trouvée."
            exit 1
          fi
          echo "Archive choisie : $ZIP"
          mkdir -p source
          unzip -q "$ZIP" -d source
          SETTINGS="$(find source -name settings.gradle.kts -type f | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts introuvable dans $ZIP"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Media-Plus-Af-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
